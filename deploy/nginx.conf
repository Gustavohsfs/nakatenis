# NakaTenis — reverse proxy para o Next em 127.0.0.1:3000
# Instalar em /etc/nginx/sites-available/nakatenis e criar o symlink em sites-enabled.
# Depois: `certbot --nginx -d nakatenis.com.br -d www.nakatenis.com.br`
# (o Certbot reescreve o bloco 80 e cria o 443 com os certificados)

server {
    listen 80;
    listen [::]:80;
    server_name nakatenis.com.br www.nakatenis.com.br;

    # Redirect para o host canônico sem www
    if ($host = www.nakatenis.com.br) {
        return 301 https://nakatenis.com.br$request_uri;
    }

    client_max_body_size 12M;   # uploads de imagem do painel (limite da app é 8M)

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss text/javascript image/svg+xml;

    # brotli on;                 # descomente se o módulo estiver instalado
    # brotli_types text/plain text/css application/json application/javascript image/svg+xml;

    # Headers de segurança (a app já envia alguns; aqui é a rede de segurança)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets com hash no nome — cache agressivo e imutável
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imagens otimizadas pelo next/image
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Uploads locais servidos direto do disco (STORAGE_DRIVER=local)
    location /uploads/ {
        alias /var/www/nakatenis/public/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O rate limit da app lê X-Forwarded-For — este header é obrigatório.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
